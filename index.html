<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开发中，敬请期待</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:#0f172a;
  color:#e2e8f0;
  font-family:system-ui, -apple-system, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.loader{
  width:48px;height:48px;
  border:4px solid #334155;
  border-top-color:#38bdf8;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:24px;
}
@keyframes spin{to{transform:rotate(360deg)}}
h1{
  font-size:2.2rem;
  margin-bottom:12px;
  color:#ffffff;
}
p{
  font-size:1.05rem;
  color:#94a3b8;
  max-width:500px;
  line-height:1.7;
}
.tip{margin-top:30px;font-size:0.9rem;color:#64748b}
</style>
</head>
<body>
<div class="loader"></div>
<h1>开发中，敬请期待</h1>
<p>我们正在精心搭建站点，很快和大家见面。</p>
<div class="tip">🔧 站点开发中</div>
</body>
</html>
